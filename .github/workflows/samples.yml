name: Samples
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-samples:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test Samples / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: actions/cache@v4
        with:
          path: test/samples/files
          key: samples-${{ hashFiles('test/samples/suites/*.json') }}
      - name: Download samples
        run: |
          npm i -g drives
          drives mirror sw8n4yxd6t8ieo4ecq3sqxtzjmz9rypyss6siofs3ipptnkuptgo test/samples/files
      - name: Run sample suite
        run: npm run test:samples
